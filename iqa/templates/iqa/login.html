{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div style="max-width:400px;margin:80px auto;">
    <h1 style="text-align:center;margin-bottom:24px;">IQA Subjective Test</h1>
    {% if form.errors %}
    <div style="background:#f8d7da;color:#721c24;padding:10px 16px;border-radius:6px;margin-bottom:16px;">
        Invalid username or password.
    </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:14px;">
            <label for="id_username" style="display:block;margin-bottom:4px;font-weight:600;">Username</label>
            <input type="text" name="username" id="id_username" autofocus
                   style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
        </div>
        <div style="margin-bottom:20px;">
            <label for="id_password" style="display:block;margin-bottom:4px;font-weight:600;">Password</label>
            <input type="password" name="password" id="id_password"
                   style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:10px;">
            Log In
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Take the CSRF token from the cookie at submit time instead of trusting the
// one rendered into this page.
//
// auth.login() and auth.logout() both call rotate_token(), so signing in
// anywhere in this browser silently invalidates the token baked into any
// *other* login page already on screen -- a second tab, or a page the browser
// restored from a previous session. Submitting that form used to 403. The
// cookie is always the current one, so reading it here makes a form that has
// been sitting open submit cleanly, and the annotator never sees an error.
//
// This is Django's documented AJAX pattern (read `csrftoken` from the cookie),
// not a weakening of CSRF: the guarantee comes from the same-origin policy --
// another origin can neither read this cookie nor reach this form. Django
// accepts the raw 32-char secret in this field, so there is no masking to do.
// `iqa.views.csrf_failure` still covers browsers with JS off or cookies
// blocked, where there is no cookie to read.
(function () {
    var form = document.querySelector('form');
    if (!form) { return; }
    form.addEventListener('submit', function () {
        var match = /(?:^|;\s*)csrftoken=([^;]*)/.exec(document.cookie);
        if (!match) { return; }
        var field = form.querySelector('[name=csrfmiddlewaretoken]');
        if (field) { field.value = decodeURIComponent(match[1]); }
    });
})();
</script>
{% endblock %}
